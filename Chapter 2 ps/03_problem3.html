<!-- 3. Use <br> and <hr> tags to display a piece of text with line breaks.  -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <h1>Line Breaks and Horizontal Rule</h1>
    <p>This is the first line of text.<br>
    This is the second line of text.<br>
    This is the third line of text.</p>
    <hr>
    <p>This is another paragraph after the horizontal rule.</p>
 </body>
 </html>
