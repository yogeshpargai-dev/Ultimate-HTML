<!-- 1. Create an HTML page with a heading (title heading), a primary heading and a 
subheading. Which tags did you use?  -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Ultimate HTML</h1>
    <p> HTML stands for HyperText Markup Language.</p>
    <h2>Inventor of HTML</h2>
    <p>Tim Berners-Lee</p>
    <h3>History of HTML</h3>
    <p>HTML was created by Tim Berners-Lee in 1991. It is the standard markup language for creating web pages and web applications.</p>
</body>
</html>
