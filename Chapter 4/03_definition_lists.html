<!-- Definition Lists -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Definition Lists</h1>
    <dl>
        <dt>HTML</dt>
        <br>
        <dd>HTML stands for HyperText Markup Language. It is the standard markup language for creating web pages.</dd>
        <dt>CSS</dt>
        <br>
        <dd>CSS stands for Cascading Style Sheets. It is used to describe the presentation of a document written in HTML.</dd>
    </dl>
</body>

</html>
